name: Deploy develop

on:
  pull_request:
    branches: ["develop"]
  push:
    branches: ["develop"]

concurrency:
  group: deploy-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Verify with Maven
        run: mvn -B verify

  build-image:
    name: Build and publish develop image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: develop
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=develop
          cache-to: type=gha,scope=develop,mode=max

  deploy:
    name: Deploy develop service
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, linux, develop]
    environment:
      name: develop
    permissions:
      contents: read

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy tesoreria core service
        run: /kibaig0ahNgashee/infraestructura/um/env-develop/deploy-tesoreria-core-develop.sh "${GITHUB_SHA}"
