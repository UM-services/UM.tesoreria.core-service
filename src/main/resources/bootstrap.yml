app:
  port: ${APP_PORT:8092}
  database: tesium
  server: 10.147.20.20:3306
  user: root
  password: root
  logging: debug
  testing: false
  # Topics de los que este servicio es dueño (KafkaTopicsConfiguration). El réplication factor es
  # ambiental: 1 con el broker único actual, 3 en la fase de cluster. KafkaAdmin nunca reasigna el
  # RF de un topic existente.
  kafka:
    topics:
      replicas: ${APP_KAFKA_TOPIC_REPLICAS:1}
      partitions: ${APP_KAFKA_TOPIC_PARTITIONS:1}
  consul:
    host: consul-service
    port: 8500

server:
  port: ${app.port}

spring:
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  application:
    name: tesoreria-core-service
  cloud:
    consul:
      host: ${app.consul.host}
      port: ${app.consul.port}
      discovery:
        prefer-ip-address: true
        # Solo resolver instancias con los checks en passing (Feign/LoadBalancer).
        query-passing: true
        # Consul: readiness (sin dependencias) + poda si queda critico.
        health-check-path: /actuator/health/readiness
        health-check-critical-timeout: 5m
        tags: tesoreria,core
  datasource:
    url: jdbc:mysql://${app.server}/${app.database}?useSSL=false&serverTimezone=UTC
    username: ${app.user}
    password: ${app.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 100
      connection-timeout: 60000
      idle-timeout: 600000        # 10 minutos
      max-lifetime: 1800000       # 30 minutos
      leak-detection-threshold: 60000  # Detectar fugas
  jpa:
    database-platform: um.tesoreria.core.configuration.MySQL57Dialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: tesoreria-core-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
logging:
  level:
    um.tesoreria.core: ${app.logging}
    web: ${app.logging}
    org:
      hibernate:
        SQL: ${app.logging}
        engine.transaction: ${app.logging}
        type.descriptor.sql.BasicBinder: ${app.logging}
      springframework:
        cloud:
          config: ${app.logging}
        transaction:
          interceptor: ${app.logging}
        orm:
          jpa: ${app.logging}
        kafka: DEBUG

tesoreria:
  audit:
    # OFF = no captura | LOG = captura y mide sin enviar | SEND = outbox + HTTP
    # Default SEND: la auditoría se registra desde el primer request.
    mode: ${TESORERIA_AUDIT_MODE:SEND}
    request-events: ${TESORERIA_AUDIT_REQUEST_EVENTS:true}
    change-events: ${TESORERIA_AUDIT_CHANGE_EVENTS:true}
    url: ${TESORERIA_AUDIT_URL:http://localhost:8211}
    api-key: ${TESORERIA_AUDIT_API_KEY:}
    batch-size: ${TESORERIA_AUDIT_BATCH_SIZE:200}
    sender-delay-ms: ${TESORERIA_AUDIT_SENDER_DELAY_MS:2000}
    sender-initial-delay-ms: ${TESORERIA_AUDIT_SENDER_INITIAL_DELAY_MS:5000}
    max-attempts: ${TESORERIA_AUDIT_MAX_ATTEMPTS:10}
    max-payload-chars: ${TESORERIA_AUDIT_MAX_PAYLOAD_CHARS:32768}
    # Enmascarado: "campo" aplica a toda entidad; "Entidad.campo" sólo a esa entidad
    # (nombre simple, sin sufijo Entity). `clave` y `cuenta` no van globales: son la clave
    # del permiso y el número de cuenta contable, respectivamente.
    mask-fields: ${TESORERIA_AUDIT_MASK_FIELDS:password,token,cbu,documento,tarjeta}
    # RESUMEN de operaciones masivas (generación de cuotas). false = auditar fila por fila.
    bulk-enabled: ${TESORERIA_AUDIT_BULK_ENABLED:true}
    # Desde esta cantidad de filas una generación se resume (SUMMARY). Debajo, fila por fila.
    bulk-min-rows: ${TESORERIA_AUDIT_BULK_MIN_ROWS:20}
    summary-entities: ${TESORERIA_AUDIT_SUMMARY_ENTITIES:ChequeraCuotaEntity,ChequeraSerieEntity,ChequeraTotalEntity}

management:
  endpoints:
    web:
      exposure:
        include:
          - "*"
          - prometheus
          - health
  endpoint:
    prometheus:
      access: unrestricted
  health:
    db:
      enabled: true  # Habilita la comprobación de salud de la base de datos
  metrics:
    enable:
      jdbc: true
  http exchanges:
    recording:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

