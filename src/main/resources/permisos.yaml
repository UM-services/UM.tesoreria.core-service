# Inventario de permisos del sistema — FUENTE DE VERDAD.
#
# Este archivo se sincroniza contra la tabla `permiso` de `tesium` al arrancar
# tesoreria-core (app.permissions.manifest-sync.enabled) y también se puede
# aplicar a demanda desde el endpoint admin POST /api/tesoreria/core/permiso/sync.
#
# Reglas:
#  - La identidad de una clave es (aplicacion, clave).
#  - Si una clave está en este archivo y no en la base, se crea.
#  - Si está en ambos, se actualizan descripcion, modulo y activo.
#  - Si existe en la base y NO está en este archivo, se retira con activo = false.
#    Nunca se borra físicamente: conserva roles/usuarios asignados.
#  - Renombrar una clave = alta de la nueva + retiro de la vieja.
#
# Para agregar una funcionalidad nueva: agregá la clave acá en el mismo PR en
# que se cablea en el código (guard, menú, directiva o @RequierePermiso).
version: 1

permisos:
  - aplicacion: TESORERIA
    clave: administrador.panel
    modulo: administrador
    descripcion: "Acceder al panel de administración"
    activo: true

  - aplicacion: TESORERIA
    clave: permisos.administrar
    modulo: permisos
    descripcion: "Administrar el catálogo de permisos, roles y solicitudes de acceso"
    activo: true

