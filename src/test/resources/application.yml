server:
  port: 8092

spring:
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:h2:mem:tesium_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=SET REFERENTIAL_INTEGRITY FALSE
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: true
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
  # En tests no hay broker: sin KafkaAdmin no se intenta crear topics ni se espera el timeout.
  autoconfigure:
    exclude: org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
logging:
  level:
    um.tesoreria.core: debug
    web: debug
    org:
      hibernate:
        SQL: debug

tesoreria:
  audit:
    # Los tests corren sobre H2 y no tienen la tabla audit_outbox:
    # con SEND el flush intentaría escribir y fallaría.
    mode: OFF
