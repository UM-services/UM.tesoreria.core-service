spring:
  datasource:
    url: jdbc:mysql://${IT_DB_HOST}:${IT_DB_PORT}/${IT_DB_NAME}?useSSL=false&serverTimezone=UTC&connectTimeout=5000
    username: ${IT_DB_USER}
    password: ${IT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      read-only: true
      connection-timeout: 10000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  cloud:
    consul:
      enabled: false
    discovery:
      enabled: false
  kafka:
    bootstrap-servers: localhost:1
    listener:
      auto-startup: false
  mail:
    host: localhost
    port: 1
logging:
  level:
    root: error
    web: error
    um.tesoreria.core: error
